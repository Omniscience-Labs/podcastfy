services:
  - type: web
    name: podcastfy-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash backend/start_flask.sh"
    plan: free
    pythonVersion: 3.11
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "False"
      - key: DEFAULT_VOICE
        value: "Rachel"
      - key: LANGUAGE
        value: "en"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PORT
        value: "8000"
