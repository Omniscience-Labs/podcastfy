services:
  - type: web
    name: podcastfy-backend
    runtime: python
    buildCommand: "cd daytona_ui && pip install -r requirements.txt"
    startCommand: "cd daytona_ui && python server.py"
    envVars:
      - key: DOPPLER_TOKEN
        fromDoppler: podcastfy-backend
    plan: free
    pythonVersion: 3.11 