services:
  - type: web
    name: podcastfy-backend
    runtime: python
    buildCommand: "pip install -r daytona_ui/requirements.txt"
    startCommand: "uvicorn daytona_ui.server:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DOPPLER_TOKEN
        fromDoppler: podcastfy-backend
    plan: free
    pythonVersion: 3.11 