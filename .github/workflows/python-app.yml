name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest (Core functionality)
      run: |
        # Run tests that don't require API keys
        python -m pytest tests/test_api.py -v --tb=short
        python -m pytest tests/test_client.py -v --tb=short
        python -m pytest tests/test_content_parser.py -v --tb=short
    
    - name: Test with pytest (API key dependent tests)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # Run tests that require API keys (will skip if keys not available)
        python -m pytest tests/test_genai_podcast.py -v --tb=short || echo "API key tests skipped - keys not available"
        python -m pytest tests/test_generate_podcast.py -v --tb=short || echo "API key tests skipped - keys not available"
    
    - name: Test with pytest (Edge TTS only - no API keys needed)
      run: |
        # Test Edge TTS functionality which doesn't require API keys
        python -m pytest tests/test_audio.py -k "edge" -v --tb=short || echo "Edge TTS tests skipped"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
