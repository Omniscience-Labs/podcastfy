<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ Podcastfy - AI Podcast Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .audio-player {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-podcast text-3xl"></i>
                    <h1 class="text-2xl font-bold">Podcastfy</h1>
                </div>
                <div class="text-sm opacity-75">
                    AI-Powered Podcast Generator
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <!-- Content Source Selection -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Input Methods -->
            <div class="bg-white rounded-lg shadow-lg p-6 card-hover">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">
                    <i class="fas fa-upload mr-2"></i>Content Sources
                </h2>
                
                <!-- URL Input -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-link mr-1"></i>Website URLs
                    </label>
                    <textarea 
                        id="urlInput" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter website URLs (one per line)&#10;Example: https://www.bbc.com/news"
                        rows="3"
                    ></textarea>
                </div>

                <!-- Text Input -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-file-text mr-1"></i>Direct Text
                    </label>
                    <textarea 
                        id="textInput" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter your text content here..."
                        rows="4"
                    ></textarea>
                </div>

                <!-- Topic Input -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lightbulb mr-1"></i>Topic Generation
                    </label>
                    <input 
                        type="text" 
                        id="topicInput" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter a topic (e.g., 'AI in healthcare')"
                    >
                </div>

                <!-- File Upload -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-file mr-1"></i>PDF Files
                    </label>
                    <div class="border-2 border-dashed border-gray-300 rounded-md p-4 text-center">
                        <input type="file" id="pdfInput" accept=".pdf" multiple class="hidden">
                        <label for="pdfInput" class="cursor-pointer">
                            <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                            <p class="text-sm text-gray-600">Click to upload PDF files</p>
                        </label>
                    </div>
                    <div id="pdfFiles" class="mt-2 text-sm text-gray-600"></div>
                </div>

                <!-- Image Upload -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-image mr-1"></i>Images
                    </label>
                    <div class="border-2 border-dashed border-gray-300 rounded-md p-4 text-center">
                        <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                        <label for="imageInput" class="cursor-pointer">
                            <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                            <p class="text-sm text-gray-600">Click to upload images</p>
                        </label>
                    </div>
                    <div id="imageFiles" class="mt-2 text-sm text-gray-600"></div>
                </div>
            </div>

            <!-- Configuration -->
            <div class="bg-white rounded-lg shadow-lg p-6 card-hover">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">
                    <i class="fas fa-cog mr-2"></i>Configuration
                </h2>

                <!-- TTS Model -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-microphone mr-1"></i>TTS Model
                    </label>
                    <select id="ttsModel" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="edge">Edge TTS (Free)</option>
                        <option value="openai">OpenAI TTS</option>
                        <option value="elevenlabs">ElevenLabs</option>
                        <option value="gemini">Gemini TTS</option>
                    </select>
                </div>

                <!-- Podcast Name -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-heading mr-1"></i>Podcast Name
                    </label>
                    <input 
                        type="text" 
                        id="podcastName" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="My AI Podcast"
                        value="PODCASTFY"
                    >
                </div>

                <!-- Conversation Style -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-comments mr-1"></i>Conversation Style
                    </label>
                    <select id="conversationStyle" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="engaging,informative">Engaging & Informative</option>
                        <option value="casual,friendly">Casual & Friendly</option>
                        <option value="professional,formal">Professional & Formal</option>
                        <option value="entertaining,humorous">Entertaining & Humorous</option>
                    </select>
                </div>

                <!-- Long Form Toggle -->
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="longForm" class="mr-2">
                        <span class="text-sm font-medium text-gray-700">
                            <i class="fas fa-clock mr-1"></i>Generate Long Form Content
                        </span>
                    </label>
                </div>

                <!-- Generate Button -->
                <button 
                    id="generateBtn" 
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-200 flex items-center justify-center"
                >
                    <i class="fas fa-magic mr-2"></i>
                    Generate Podcast
                </button>
            </div>
        </div>

        <!-- Progress Section -->
        <div id="progressSection" class="hidden bg-white rounded-lg shadow-lg p-6 mb-8">
            <h3 class="text-lg font-semibold mb-4 text-gray-800">
                <i class="fas fa-spinner mr-2"></i>Generating Your Podcast
            </h3>
            <div class="space-y-4">
                <div class="flex items-center space-x-3">
                    <div class="loading-spinner"></div>
                    <span id="progressText" class="text-gray-700">Processing content...</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-purple-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden">
            <!-- Audio Player -->
            <div class="audio-player mb-6">
                <h3 class="text-xl font-semibold mb-4">
                    <i class="fas fa-play-circle mr-2"></i>Your Generated Podcast
                </h3>
                <audio id="audioPlayer" controls class="w-full">
                    Your browser does not support the audio element.
                </audio>
                <div class="mt-4 flex space-x-4">
                    <button id="downloadBtn" class="bg-white text-purple-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="fas fa-download mr-1"></i>Download MP3
                    </button>
                    <button id="shareBtn" class="bg-white text-purple-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="fas fa-share mr-1"></i>Share
                    </button>
                </div>
            </div>

            <!-- Transcript -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4 text-gray-800">
                    <i class="fas fa-file-text mr-2"></i>Transcript
                </h3>
                <div id="transcriptContent" class="bg-gray-50 p-4 rounded-md max-h-96 overflow-y-auto text-sm text-gray-700">
                    <!-- Transcript content will be loaded here -->
                </div>
                <button id="downloadTranscriptBtn" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                    <i class="fas fa-download mr-1"></i>Download Transcript
                </button>
            </div>
        </div>

        <!-- Error Section -->
        <div id="errorSection" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 mb-8">
            <div class="flex items-center">
                <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                <span id="errorMessage" class="text-red-700"></span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm opacity-75">
                Powered by Podcastfy - AI-Powered Podcast Generation
            </p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
